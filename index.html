<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>育児サポート</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1 class="header-title">🌸 育児サポート</h1>
  </header>

  <main class="main-content">

    <!-- 離乳食タブ -->
    <section id="tab-recipe" class="tab-panel active">
      <h2>離乳食レシピ</h2>

      <div id="too-young-notice" class="notice-info hidden">
        離乳食時期を生後5〜6ヶ月からと前提したレシピ提案となります。
      </div>

      <div class="form-group">
        <label>月齢</label>
        <select id="age-input">
          <option value="">月齢を選択してください</option>
          <option value="5">5ヶ月</option>
          <option value="6">6ヶ月</option>
          <option value="7">7ヶ月</option>
          <option value="8">8ヶ月</option>
          <option value="9">9ヶ月</option>
          <option value="10">10ヶ月</option>
          <option value="11">11ヶ月</option>
          <option value="12">12ヶ月</option>
          <option value="13">13ヶ月</option>
          <option value="14">14ヶ月</option>
          <option value="15">15ヶ月</option>
          <option value="16">16ヶ月</option>
          <option value="17">17ヶ月</option>
          <option value="18">18ヶ月</option>
          <option value="19">19ヶ月</option>
          <option value="20">20ヶ月</option>
          <option value="21">21ヶ月</option>
          <option value="22">22ヶ月</option>
          <option value="23">23ヶ月</option>
          <option value="24">24ヶ月</option>
        </select>
      </div>

      <div id="food-guide" class="food-guide hidden">
        <div class="food-guide-header">
          <span id="food-guide-stage"></span>
          <span id="food-guide-texture" class="food-guide-texture"></span>
        </div>
        <div class="food-guide-cols">
          <div class="food-guide-col ok">
            <div class="food-guide-col-title">✅ 使える食材例</div>
            <div id="food-guide-ok"></div>
          </div>
          <div class="food-guide-col ng">
            <div class="food-guide-col-title">❌ 避ける食材</div>
            <div id="food-guide-ng"></div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>使う食材</label>
        <textarea id="ingredients-input"
          placeholder="例: にんじん、じゃがいも、鶏ひき肉"></textarea>
      </div>

      <div class="form-group">
        <label>アレルギー除外食材</label>
        <div id="recipe-allergy-display" class="allergy-list"></div>
        <small style="color:var(--text-muted);font-size:12px;margin-top:4px;display:block">
          設定タブで編集できます
        </small>
      </div>

      <button id="generate-btn" class="btn-primary">レシピを作る</button>
      <div id="loading" class="loading hidden">レシピを考えています...</div>
      <div id="error-msg" class="error-msg hidden"></div>
      <div id="recipe-result" class="recipe-card hidden"></div>
    </section>

    <!-- 予防接種タブ -->
    <section id="tab-vaccine" class="tab-panel">
      <h2>予防接種スケジュール</h2>
      <div id="vaccine-no-birthdate" class="error-msg hidden">
        設定タブで生年月日を登録してください
      </div>
      <div id="vaccine-list"></div>
    </section>

    <!-- 設定タブ -->
    <section id="tab-settings" class="tab-panel">
      <h2>設定</h2>

      <div class="form-group">
        <label>Gemini APIキー</label>
        <input type="text" id="api-key-input" placeholder="AIza...">
      </div>

      <div class="form-group">
        <label>赤ちゃんの名前（任意）</label>
        <input type="text" id="name-input" placeholder="例: さくら">
      </div>

      <div class="form-group">
        <label>生年月日</label>
        <input type="date" id="birthdate-input">
      </div>

      <div class="form-group">
        <label>アレルギー除外食材</label>
        <div class="allergy-input-row">
          <input type="text" id="allergy-new-input" placeholder="例: 卵">
          <button class="btn-secondary" id="allergy-add-btn">追加</button>
        </div>
        <div id="allergy-chip-list" class="allergy-list" style="margin-top:8px"></div>
      </div>

      <button id="save-settings-btn" class="btn-primary">保存する</button>

      <div class="divider">
        <button id="clear-all-btn" class="btn-danger">すべてのデータを削除</button>
      </div>
    </section>

  </main>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="recipe">
      <span class="tab-icon">🍼</span>
      <span class="tab-label">離乳食</span>
    </button>
    <button class="tab-btn" data-tab="vaccine">
      <span class="tab-icon">💉</span>
      <span class="tab-label">予防接種</span>
    </button>
    <button class="tab-btn" data-tab="settings">
      <span class="tab-icon">⚙️</span>
      <span class="tab-label">設定</span>
    </button>
  </nav>

  <script src="storage.js"></script>
  <script src="vaccination.js"></script>
  <script src="food-guide.js"></script>
  <script src="gemini.js"></script>
  <script src="app.js"></script>
</body>
</html>
